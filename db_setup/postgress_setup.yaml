services:
  pgvector:
    image: pgvector/pgvector:pg17

    container_name: pgvector_db

    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_db

    ports:
      - "5433:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data: